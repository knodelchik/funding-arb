# M2 paper executor config. Universe v2 (2026-10-09): top hedgeable HL-carry
# names from the wide-universe research, expanded 8 -> 13. hedge_mode=spot
# wherever Binance lists the spot pair (HYPE/PUMP gained spot since v1 —
# new entries hedge via spot; open positions keep their frozen mode).
# XMR/FARTCOIN are perp-only on Binance -> spread-gated entries.
capital_usd = 100000
max_positions = 8

[[universe]]
symbol = "HYPEUSDT"
hl_coin = "HYPE"
hedge_mode = "spot"
max_notional = 20000

