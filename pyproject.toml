[project]
name = "funding-arb"
version = "0.1.0"
description = "Binance cash-and-carry funding-rate arbitrage: M0 data collector + honest backtest"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.27",
    "polars>=1.42,<2",
    "pyarrow>=17",
    "pydantic>=2.7",
]

[project.scripts]
farb = "farb.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff", "respx>=0.22"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/farb"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
